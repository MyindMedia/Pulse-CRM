name: Uptime — do the live routes answer?

# Runs on GitHub's runners, deliberately NOT on Netlify: the thing we are
# watching for is Netlify refusing every request on this account, so the watcher
# cannot live there. See scripts/uptime-check.sh for the incident this came from.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Load the routes
        id: probe
        run: |
          set +e
          bash scripts/uptime-check.sh | tee /tmp/uptime.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open or update the outage issue
        if: steps.probe.outputs.status != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "🔴 Live routes are down"
        run: |
          BODY="$(printf 'Automated route check failed at %s.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(cat /tmp/uptime.txt)" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "" || gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close the outage issue once routes recover
        if: steps.probe.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "🔴 Live routes are down"
        run: |
          EXISTING="$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')"
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --comment "All routes returned 200 at $(date -u +%Y-%m-%dT%H:%M:%SZ). Recovered."
          fi

      # Fail the job last, so the issue is filed even when we exit non-zero.
      - name: Fail if any route is down
        if: steps.probe.outputs.status != '0'
        run: exit 1
